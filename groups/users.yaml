---
# docs/examples/standard-aws/groups/users.yaml -- the roster. Reference:
# ../../../CONFIGURATION.md section 11.6 (users) and 13 (encrypted values).
# A user's `name` is the bare OPA username that group members/admins lists
# use. Each identifying value is an ENC[age:...] marker encrypted to the
# tree's recipients; ANY value may be one, and it decrypts at load when
# CSIS_CONFIG_IDENTITY names an identity. These two are synthetic personas
# (the frozen fixture's) -- the first decrypts to avery.alpha, the second to
# casey.charlie; their addresses derive from the user builder's template.
users:
  - name: ENC[age:]
    first_name: Mykel
    last_name: Alvis
    # ZW
  - name: ENC[age:]
    first_name: Zach
    last_name: Wills