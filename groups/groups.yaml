---
# docs/examples/standard-aws/groups/groups.yaml -- the ONE group. Reference:
# ../../../CONFIGURATION.md section 11.5. Every member and admin must be a
# declared user name (here the fixture's markers for avery.alpha and
# casey.charlie). The okta-tf builder emits, for this group, the OPA groups
# team_user and team_admin, the resource group team_rg (delegated to
# team_admin), the project team_rg_login and the user/admin security policies.
groups:
  - name: walk_team                   # REPLACE: your group's name; the OPA names derive from it
    # DECISION: exactly one group in a tree must be the root/admin group, and
    # this tree has only one, so it is both the root group and the group that
    # owns the image and the storage. A larger tree keeps a separate root
    # admin group and one group per team (see docs/examples/complete/).
    is_root: true
    description: "{{ group.name }}: the team's one group"
    admins:
      - ENC[age:]
    tags:
      environment: development
