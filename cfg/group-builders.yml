---
# docs/examples/standard-aws/cfg/group-builders.yml -- the identity builders:
# groups as MANAGED Okta Privileged Access (OPA) resources, users as read-only
# lookups. Reference: ../../../CONFIGURATION.md section 9 (9.1 the shared
# workspace fields, 9.2 group builders, 9.3 user builders).
group_builders:
  - name: opa-groups
    type: okta-tf                # DECISION: managed OPA groups (`okta-tf-ro` would only look existing groups up)
    is_default: true
    executable: open-tofu
    org: noaa
    team: nos-coastal-modeling-cloud-sandbox
    # DECISION (stage 75, REQUIRED): the posix group builder that makes these
    # groups exist on the machines of their images -- created after each
    # applying run with OPA's gid, members joined at each login (OPA's agent
    # makes accounts at a login and drops their groups when it deletes them).
    # `posix: none` keeps the groups off the machines: their storage subtrees
    # are then owned by a bare gid no account is in.
    posix: posix-local
    # DECISION: the API key pair stays out of the tree. Left at their
    # defaults, `key` and `secret` become `var.<team>_key` / `var.<team>_secret`,
    # filled from the environment at finalize. The complete example shows the
    # alternative: literal ENC[age:...] values emitted by reference.
    required_providers:
      - name: oktapam
        source: okta/oktapam
        version: ">= 0.6.3"
  # stage 75: the posix group builder `posix:` above names. No terraform root,
  # no credentials; it creates groups (and, for its own groups, accounts) on
  # the machines. Reference: the posix-identity-plugin README.
  - name: posix-local
    type: posix
user_builders:
  - name: okta-users
    type: okta-tf-ro             # DECISION: read-only -- users are made by hand in Okta; this only emits `data "okta_user"` lookups
    is_default: true
    executable: open-tofu
    org: noaa          # REPLACE
    team: nos-coastal-modeling-cloud-sandbox        # REPLACE
    email_as_username: false     # DECISION: a user's `name` is the bare OPA username, not its email
    # DECISION: the address of a user that declares none is derived from its
    # name and this domain (the address is used ONLY to look the user up).
    email_domain: ENC[age:YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSAyUTFzZ1BHYlNvME8vcmhneG5kbXF1MlR3MUJKZ0phcGdXbzFkNEFRUnhFCkg3L0h2S2tQU0NwL1FRQ2hFUElHREJJWjNwZ3BLaG93clQwbjhhOUtPaTQKLS0tIHBTS3oySHNGaUtMRERwVVVuNk9ER3VERXNPUWpvTDVrRFIrYy9qYXlOWkUKoO+MnSzF6NS3s1VrDeHpvHrQXmN03kd/mLdszCeyNUcx2PTjfWHu+w==]
    default_user_email_template: "{{ user.name }}@{{ builder.email_domain }}"
    required_providers:
      - name: okta
        source: okta/okta
        version: ">= 6.0"
